name: Publish to NPM (Manual)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Digite "SIM" para confirmar a publicação do pacote'
        required: true
        type: string
        default: 'NÃO'
      otp:
        description: 'Código 2FA (OTP) do seu autenticador do NPM (deixe vazio se não for necessário)'
        required: false
        type: string

jobs:
  publish:
    name: Build & Publish Package
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish to NPM
        run: |
          # Validar confirmação
          if [ "${{ github.event.inputs.confirm }}" != "SIM" ]; then
            echo "::error::Publicação rejeitada ou não confirmada. Confirmação fornecida: '${{ github.event.inputs.confirm }}'."
            exit 1
          fi

          # Validar OTP
          if [ -z "${{ github.event.inputs.otp }}" ]; then
            echo "::error::Código OTP (2FA) do NPM é obrigatório para a publicação, mas não foi fornecido."
            exit 1
          fi

          # Executar publicação
          npm publish --access public --tag rc --otp "${{ github.event.inputs.otp }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
